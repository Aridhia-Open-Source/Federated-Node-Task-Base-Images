name: fn_base_test
services:
  analytics:
    container_name: analytics-py
    image: ghcr.io/aridhia-open-source/python-base:${TAG}
    environment:
      USER: 'user'
      PASSWORD: 'Password123!'
      DATABASE: 'data'
      HOST: db
      PORT: 5432
    command: ["python3", "/app/connect.py"]
    volumes:
     - $PWD/tests/app:/app/:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: db
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'Password123!'
      POSTGRES_DB: 'data'
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
