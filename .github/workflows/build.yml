name: Build Docker Image
run-name: Building images
on:
  workflow_dispatch:
  push:
    tags:
      - '**'
    branches:
      - main
      - pipeline
    paths-ignore:
      - '*.md'
      - 'README'
      - 'LICENSE'
      - 'Makefile'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'README'
      - 'LICENSE'
      - 'Makefile'
      - '.gitignore'
env:
  TAG: ''
  OWNER_LC: ''
  IS_TAG: ${{ github.ref_type == 'tag' }}
  DEV_BUILD: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  packages: write

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.vars.outputs.IS_TAG }}
      dev_build: ${{ steps.vars.outputs.DEV_BUILD }}
      tag: ${{ steps.vars.outputs.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setting global values
        id: vars
        run: |
          echo "IS_TAG=${{ env.IS_TAG }}" >> ${GITHUB_OUTPUT}
          echo "DEV_BUILD=${{ env.DEV_BUILD }}" >> ${GITHUB_OUTPUT}

          version=$(cat .version)
          echo "Tag: ${version}"

          if [[ "${{ env.DEV_BUILD }}" == "false" ]]; then
            echo "TAG=${version}" >> ${GITHUB_OUTPUT}
          else
            echo "TAG=${version}-v${GITHUB_SHA::6}" >> ${GITHUB_OUTPUT}
          fi
  linters:
    needs: init
    if: needs.init.outputs.is_tag == 'false'
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pylint
        run: |
          make pylint

      - name: Run hadolint
        run: |
          make hadolint
  tests:
    needs:
      - init
      - linters
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    if: needs.init.outputs.is_tag == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Run Python Tests
        working-directory: webserver
        run: |
          make tests_ci

      - uses: irongut/CodeCoverageSummary@v1.3.0
        name: Code Coverage Summary Report
        with:
          filename: artifacts/coverage.xml
          fail_below_min: true
          thresholds: '60 80'
  build:
    needs:
      - init
      - tests
    if: needs.init.outputs.is_tag == 'false'
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Need to get a registry where to push the image
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_CR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'
      - name: Build and push Python Base
        uses: docker/build-push-action@v5
        with:
          context: python
          file: python/Dockerfile
          tags: ${{ vars.DOCKER_CR }}/${{ env.OWNER_LC }}/python-base:${{ needs.init.outputs.tag }}
          push: true
      - name: Build and push R Base
        uses: docker/build-push-action@v5
        with:
          context: R
          file: R/Dockerfile
          tags: ${{ vars.DOCKER_CR }}/${{ env.OWNER_LC }}/r-base:${{ needs.init.outputs.tag }}
          push: true
      - name: Run Tests
        run: |
          ./tests/run.sh
  sumamry:
    needs:
      - init
    runs-on: ubuntu-latest
    steps:
      - name: Set summary
        run: |
          echo "# Docker Images Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ needs.init.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
